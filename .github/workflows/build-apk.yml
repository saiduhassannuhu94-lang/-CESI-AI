name: Build CESI APK

on:
  push:
    branches: [main, feature/cesi-ui-ux-foundation]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Prepare release APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/cesi-ui-ux-foundation' && startsWith(github.event.head_commit.message, '[publish-apk]')
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/CESI-AI-debug.apk

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/cesi-ui-ux-foundation' && startsWith(github.event.head_commit.message, '[publish-apk]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v0.4.0-ui-foundation" \
            "app/build/outputs/apk/debug/CESI-AI-debug.apk" \
            --target "${GITHUB_SHA}" \
            --title "CESI-AI v0.4.0 UI Foundation" \
            --generate-notes

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CESI-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
