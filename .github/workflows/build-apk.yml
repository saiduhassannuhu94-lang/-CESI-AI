name: Build CESI APK

run-name: CESI build • ${{ github.ref_name }} • ${{ github.sha }}

on:
  push:
    branches:
      - main
      - 'feature/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - 'feature/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cesi-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify Gradle toolchain
        run: gradle --version

      - name: Unit tests
        run: gradle testDebugUnitTest --no-daemon

      - name: Android lint
        run: gradle lintDebug --no-daemon

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Prepare release APK
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, '[publish-apk v'))
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/CESI-AI-debug.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, '[publish-apk v'))
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT_MESSAGE: ${{ github.event.head_commit.message || '' }}
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="$(printf '%s' "${RELEASE_COMMIT_MESSAGE}" | sed -nE 's/^\[publish-apk (v[^]]+)\].*/\1/p')"
          fi
          if [[ -z "${VERSION}" || "${VERSION}" != v* ]]; then
            echo "Could not determine a valid release version from ref/commit message."
            exit 1
          fi
          APK="app/build/outputs/apk/debug/CESI-AI-debug.apk"
          if gh release view "${VERSION}" >/dev/null 2>&1; then
            gh release upload "${VERSION}" "${APK}" --clobber
          else
            RELEASE_FLAGS=()
            if [[ "${VERSION}" == *-test* || "${VERSION}" == *-rc* || "${VERSION}" == *-beta* ]]; then
              RELEASE_FLAGS+=(--prerelease)
            fi
            gh release create "${VERSION}" "${APK}" --target "${GITHUB_SHA}" --title "CESI AI ${VERSION}" --generate-notes "${RELEASE_FLAGS[@]}"
          fi

      - name: Upload latest APK to BrowserStack App Live
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
        run: |
          if [ -z "$BROWSERSTACK_USERNAME" ] || [ -z "$BROWSERSTACK_ACCESS_KEY" ]; then
            echo "BrowserStack secrets are not configured; skipping App Live upload."
            exit 0
          fi

          RESPONSE=$(curl --fail-with-body -u "${BROWSERSTACK_USERNAME}:${BROWSERSTACK_ACCESS_KEY}" \
            -X POST "https://api-cloud.browserstack.com/app-live/upload" \
            -F "file=@app/build/outputs/apk/debug/app-debug.apk" \
            -F 'data={"custom_id":"CESI-AI-latest"}')
          echo "$RESPONSE" | tee browserstack-response.json
          APP_URL=$(python -c 'import json; print(json.load(open("browserstack-response.json"))["app_url"])')
          echo "BrowserStack App Live app_url: $APP_URL" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CESI-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
